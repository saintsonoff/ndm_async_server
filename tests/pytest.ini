[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
timeout = 30
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    concurrent: tests that involve concurrent operations
    property: property-based tests using hypothesis
